
name: Alpaca Paper Trading

on:
  schedule:
    # Covers 10–11 AM Eastern during both daylight and standard time.
    - cron: "*/5 14-15 * * 1-5"
  workflow_dispatch:

concurrency:
  group: alpaca-paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check trading window
        id: market_window
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          if [ "$HOUR" = "10" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Alpaca trading bot
        if: steps.market_window.outputs.open == 'true'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python alpaca_trader.py

      - name: Skip outside trading window
        if: steps.market_window.outputs.open != 'true'
        run: echo "Outside the 10–11 AM Eastern trading window. Skipping."
